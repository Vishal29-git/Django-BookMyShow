{% extends "movies/base.html" %}
{% block content %}
<div class="container mt-5">
  <h2>Complete Your Payment</h2>
  <p>Booking: {{ booking }}</p>
  <p>Amount: ₹{{ payment.amount }}</p>

  <button id="pay-btn" class="btn btn-primary">Pay Now ₹{{ payment.amount }}</button>
</div>

<!-- Razorpay JavaScript SDK -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  document.getElementById("pay-btn").onclick = function () {
    var options = {
      key:         "{{ razorpay_key_id }}",   // Public key only
      amount:      "{{ amount }}",            // Amount in paise
      currency:    "{{ currency }}",
      order_id:    "{{ razorpay_order_id }}",
      name:        "BookMySeat",
      description: "Movie Ticket Booking",

      // ⚠️ This handler runs on SUCCESS in the browser
      // We verify the signature server-side — NEVER trust this alone
      handler: function (response) {
        var form = document.createElement("form");
        form.method = "POST";
        form.action = "{% url 'payment_callback' %}";

        // Django CSRF token
        var csrf = document.createElement("input");
        csrf.type  = "hidden";
        csrf.name  = "csrfmiddlewaretoken";
        csrf.value = "{{ csrf_token }}";
        form.appendChild(csrf);

        // Send all three IDs to the server for verification
        ["razorpay_payment_id", "razorpay_order_id", "razorpay_signature"].forEach(function(key) {
          var inp = document.createElement("input");
          inp.type  = "hidden";
          inp.name  = key;
          inp.value = response[key];
          form.appendChild(inp);
        });

        document.body.appendChild(form);
        form.submit();
      },

      prefill: {
        name:  "{{ request.user.get_full_name }}",
        email: "{{ request.user.email }}",
      },

      theme: { color: "#3399cc" }
    };

    var rzp = new Razorpay(options);

    // Handle popup close / cancellation gracefully
    rzp.on("payment.failed", function (response) {
      alert("Payment failed: " + response.error.description);
      window.location.href = "{% url 'payment_failed' %}";
    });

    rzp.open();
  };
</script>
{% endblock %}
